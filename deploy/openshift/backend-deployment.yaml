apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-inventory-api
  labels:
    app.kubernetes.io/name: server-inventory-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: server-inventory-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server-inventory-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: server-inventory
    spec:
      # No securityContext.runAsUser here: OpenShift's restricted-v2 SCC
      # assigns a UID from the namespace's allocated range at admission
      # time. The image writes nothing to disk at runtime, so it works
      # correctly under any assigned UID without requiring anyuid.
      containers:
        - name: api
          # Published by CI on every push to main — see
          # docs/adr/0010-image-publishing-and-versioning.md. Pin to a
          # real vX.Y.Z tag for anything beyond local experimentation.
          image: ghcr.io/team-redbull/server_scan-api:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: INVENTORY_ENVIRONMENT
              value: production
            - name: INVENTORY_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: server-inventory-db
                  key: mongo-uri
            - name: INVENTORY_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: server-inventory-db
                  key: redis-uri
          envFrom:
            - configMapRef:
                name: server-inventory-api-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
