# Non-secret configuration only. Mongo/Redis URIs live in the
# server-inventory-db Secret (see deploy/README.md) and are wired directly
# in backend-deployment.yaml, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-inventory-api-config
  labels:
    app.kubernetes.io/name: server-inventory-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-inventory
data:
  INVENTORY_LOG_LEVEL: "INFO"
  INVENTORY_METRICS_ENABLED: "true"
  INVENTORY_DEFAULT_PAGE_SIZE: "50"
  INVENTORY_MAX_PAGE_SIZE: "200"
  INVENTORY_CORS_ALLOWED_ORIGINS: "" # set to the frontend Route's origin
