# Runs tools/run_collector.py --manager-type UCS_MANAGER on a schedule.
# Uses the exact same image as the API Deployment (see Containerfile's
# comment on why tools/ rides along in that image rather than getting its
# own) — only the container's command/args differ.
#
# Connection details: one endpoint + login per vendor, as INVENTORY_*
# environment variables from the `server-inventory-collector-credentials`
# Secret below. That Secret is the whole of a collector's connection
# config — there are no Manager documents to create and no credentials
# volume to mount.
#
# `envFrom` a Secret rather than inline `env` values: `kubectl get cronjob
# -o yaml` and `kubectl describe pod` both print plain `env` values to
# anyone who can read workloads in the namespace, while a secretRef shows
# only the reference.
#
# The example Secret at the bottom of this file has a placeholder
# password and is here to show the shape. Replace it with one from a real
# secret store, or use the Helm chart, which renders the same thing from
# `collectors.*` values (and can defer to an existing Secret entirely via
# `collectors.existingSecret`).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: server-inventory-collector-ucs-manager
  labels:
    app.kubernetes.io/name: server-inventory-collector-ucs-manager
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-inventory
spec:
  # Every 30 minutes — a starting point, not a tuned value. Balance
  # "inventory shouldn't go stale for long" against UCS Manager's
  # documented 256-concurrent-session cap and how many managers/servers
  # this actually has to walk; adjust per real fleet size.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid # a still-running collection blocks the next tick rather than overlapping it
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # tools/run_collector.py does not retry within a run (a failed
      # manager is logged and skipped, not retried) — this is the outer,
      # whole-Job retry. One retry re-runs every manager, including ones
      # that already succeeded; harmless (ingestion is upsert-idempotent)
      # but not free, so this stays low rather than defaulting to 6.
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          # No securityContext.runAsUser: same reasoning as
          # backend-deployment.yaml — OpenShift's restricted-v2 SCC
          # assigns the UID at admission time.
          containers:
            - name: collector
              # Same image as the API Deployment — see Containerfile's
              # comment on why tools/ rides along in it. Published by CI
              # on every push to main (docs/adr/0010).
              image: ghcr.io/team-redbull/server_scan-api:latest
              command: ["python3", "-m", "tools.run_collector", "--manager-type", "UCS_MANAGER"]
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                - name: INVENTORY_MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: server-inventory-db
                      key: mongo-uri
                - name: INVENTORY_REDIS_URI
                  valueFrom:
                    secretKeyRef:
                      name: server-inventory-db
                      key: redis-uri
              envFrom:
                - configMapRef:
                    name: server-inventory-api-config
                - secretRef:
                    name: server-inventory-collector-credentials
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
---
# Example only — replace with a Secret from a real secret store. Every
# key is optional: a vendor left unset simply has no collector to run,
# and tools/run_collector.py exits with an error naming the variables it
# needed. Intersight reuses the same three keys with different meanings
# (username = API Key ID, password = secret key) because it signs
# requests rather than logging in.
apiVersion: v1
kind: Secret
metadata:
  name: server-inventory-collector-credentials
  labels:
    app.kubernetes.io/name: server-inventory-collector-credentials
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-inventory
type: Opaque
stringData:
  INVENTORY_UCS_MANAGER_IP: "ucsm-dc1.example.com"
  INVENTORY_UCS_MANAGER_USERNAME: "inventory-svc"
  INVENTORY_UCS_MANAGER_PASSWORD: "replace-me"

  INVENTORY_UCS_CENTRAL_IP: ""
  INVENTORY_UCS_CENTRAL_USERNAME: ""
  INVENTORY_UCS_CENTRAL_PASSWORD: ""

  INVENTORY_ONEVIEW_IP: ""
  INVENTORY_ONEVIEW_USERNAME: ""
  INVENTORY_ONEVIEW_PASSWORD: ""

  INVENTORY_OME_IP: ""
  INVENTORY_OME_USERNAME: ""
  INVENTORY_OME_PASSWORD: ""

  INVENTORY_INTERSIGHT_IP: ""
  INVENTORY_INTERSIGHT_USERNAME: ""
  INVENTORY_INTERSIGHT_PASSWORD: ""
