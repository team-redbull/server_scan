{{- if .Values.route.enabled }}
{{- /* With a frontend, the SPA takes / and the API gets one Route per path. See deploy/README.md. */ -}}
{{- $paths := .Values.frontend.enabled | ternary .Values.route.apiPaths (list "") }}
{{- range $path := $paths }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ printf "%s-api%s" $.Release.Name (empty $path | ternary "" (printf "-%s" (trimPrefix "/" $path | replace "/" "-" | replace "." "-"))) }}
  labels:
    app.kubernetes.io/name: {{ $.Release.Name }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-inventory
spec:
  {{- if $.Values.route.host }}
  host: {{ $.Values.route.host }}
  {{- else if $.Values.frontend.enabled }}
  {{- required "route.host must be set when frontend.enabled: the SPA and the API share one host, and an OpenShift-generated host differs per Route." "" }}
  {{- end }}
  {{- if $path }}
  path: {{ $path }}
  {{- end }}
  to:
    kind: Service
    name: {{ $.Release.Name }}-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
