backend:
  image:
    # Published by .github/workflows/ci.yml's `publish` job on every push
    # to main (see docs/adr/0010-image-publishing-and-versioning.md) —
    # pin `tag` to a real vX.Y.Z release for anything beyond local
    # experimentation; `latest` always means whatever main last built.
    repository: ghcr.io/team-redbull/server_scan-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Name of a pre-existing Secret with keys `mongo-uri` and `redis-uri`.
# This chart does not create it — see deploy/README.md for why MongoDB
# and Redis are treated as externally provisioned platform services.
db:
  secretName: server-inventory-db

config:
  logLevel: INFO
  metricsEnabled: "true"
  defaultPageSize: "50"
  maxPageSize: "200"
  corsAllowedOrigins: ""

route:
  enabled: true
  host: "" # empty lets OpenShift generate one from the Service name

# Real vendor collectors, run as CronJobs against the same image as the
# API (tools/run_collector.py --manager-type <type>). One block per
# manager type; only ucsManager is implemented so far (see
# tools/run_collector.py's _PROVIDER_FACTORIES).
collectors:
  ucsManager:
    enabled: false # opt-in: needs real Manager documents + Secrets to do anything useful
    schedule: "*/30 * * * *"
    backoffLimit: 1
    activeDeadlineSeconds: 900
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # One entry per UCS Manager domain to collect from. `credentialRef`
    # must match the `credential_ref` set on that domain's `Manager`
    # document; `secretName` is a pre-existing Secret (this chart doesn't
    # create it) with `username`/`password` keys. Adding a manager here
    # is the whole onboarding step — no other template needs editing.
    managers: []
    # managers:
    #   - credentialRef: ucsm-dc1
    #     secretName: ucsm-dc1-credentials
    #   - credentialRef: ucsm-dc2
    #     secretName: ucsm-dc2-credentials
