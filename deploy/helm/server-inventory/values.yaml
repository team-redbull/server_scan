backend:
  image:
    # Published by .github/workflows/ci.yml's `publish` job on every push
    # to main (see docs/adr/0010-image-publishing-and-versioning.md) —
    # pin `tag` to a real vX.Y.Z release for anything beyond local
    # experimentation; `latest` always means whatever main last built.
    repository: ghcr.io/team-redbull/server_scan-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Name of a pre-existing Secret with keys `mongo-uri` and `redis-uri`.
# This chart does not create it — see deploy/README.md for why MongoDB
# and Redis are treated as externally provisioned platform services.
db:
  secretName: server-inventory-db

config:
  logLevel: INFO
  metricsEnabled: "true"
  defaultPageSize: "50"
  maxPageSize: "200"
  corsAllowedOrigins: ""

route:
  enabled: true
  host: "" # empty lets OpenShift generate one from the Service name

# Real vendor collectors, run as CronJobs against the same image as the
# API (tools/run_collector.py --manager-type <type>).
#
# One endpoint + login per vendor, and that is the whole of a collector's
# connection config — no Manager documents to create, no secret volume to
# mount. These are rendered into one Secret and injected as INVENTORY_*
# environment variables (see templates/collector-credentials-secret.yaml).
#
# DO NOT COMMIT REAL PASSWORDS HERE. Pass them at install time
# (`--set collectors.ucsManager.password=...`), from a values file kept
# out of git (`-f secrets.yaml`), or — for production — set
# `existingSecret` below and let a secrets operator own the Secret.
collectors:
  # Name of a Secret managed outside this chart, holding the same
  # INVENTORY_* keys. Set it and the chart stops rendering its own Secret
  # from the values below entirely.
  existingSecret: ""

  # Cisco UCS Manager — the only collector implemented so far (see
  # tools/run_collector.py's _PROVIDER_FACTORIES).
  ucsManager:
    enabled: false # opt-in: needs ip/username/password below to do anything
    ip: ""
    username: ""
    password: ""
    schedule: "*/30 * * * *"
    backoffLimit: 1
    activeDeadlineSeconds: 900
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  # Cisco UCS Central. No collector yet — it is a discovery parent over
  # UCS Manager domains rather than an inventory source of its own.
  ucsCentral:
    ip: ""
    username: ""
    password: ""

  # HPE OneView. No collector yet.
  oneview:
    ip: ""
    username: ""
    password: ""

  # Dell OpenManage Enterprise. No collector yet.
  ome:
    ip: ""
    username: ""
    password: ""

  # Cisco Intersight. No collector yet, and note these three fields mean
  # something different here: Intersight signs each request with an API
  # key instead of logging in, so `username` is the API Key ID and
  # `password` is the secret key. `ip` is "intersight.com" for the SaaS
  # tenant, or the appliance FQDN for a Connected Virtual Appliance.
  intersight:
    ip: ""
    username: ""
    password: ""
