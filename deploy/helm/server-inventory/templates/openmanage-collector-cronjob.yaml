{{- /*
The Dell collector: one CronJob against one OpenManage Enterprise
appliance, which manages the whole Dell estate.

The pod talks to OME *and* to every collected server's iDRAC. Two bulk
REST calls against the appliance enumerate every server profile and
managed device; the servers whose name matches `namePattern` then have
their hardware read from their own BMC over Redfish.

So this pod needs egress to the whole Dell BMC network, not just to the
appliance, and `envFrom` pulls two logins from the shared vendor Secret:
INVENTORY_OME_IP/_USERNAME/_PASSWORD for the appliance, and
INVENTORY_OME_BMC_USERNAME/_PASSWORD for the iDRACs.

Cost is per *server* here, not per appliance — ~25 requests against each
collected machine — which is why this runs on the Redfish collector's
cadence rather than hourly. See
docs/adr/0020-dell-identity-from-ome-hardware-from-redfish.md and
docs/dell-collectors.md.
*/ -}}
{{- if .Values.collectors.ome.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-collector-openmanage
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-collector-openmanage
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-inventory
spec:
  schedule: {{ .Values.collectors.ome.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.collectors.ome.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.collectors.ome.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: collector
              image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python3", "-m", "tools.run_collector", "--manager-type", "OPENMANAGE"]
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                # Which servers this collector may ingest at all, matched
                # against the server's name. Collector-scoped, so it lives
                # here rather than in the API ConfigMap this also mounts.
                - name: INVENTORY_COLLECTOR_NAME_PATTERN
                  value: {{ .Values.collectors.namePattern | quote }}
                # BMCs contacted at once, and the TLS policy for them.
                # Collector-scoped like the pattern above. Everything else
                # about talking to a BMC comes from the shared `redfish_*`
                # defaults — same protocol, same class of device.
                - name: INVENTORY_REDFISH_FLEET_CONCURRENCY
                  value: {{ .Values.collectors.ome.bmcConcurrency | quote }}
                - name: INVENTORY_OME_BMC_VERIFY_TLS
                  value: {{ .Values.collectors.ome.bmcVerifyTls | quote }}
                - name: INVENTORY_OME_BMC_PORT
                  value: {{ .Values.collectors.ome.bmcPort | quote }}
                - name: INVENTORY_MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.db.secretName }}
                      key: mongo-uri
                - name: INVENTORY_REDIS_URI
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.db.secretName }}
                      key: redis-uri
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-api-config
                # Endpoint + login for every vendor, as INVENTORY_* env
                # vars. `envFrom` a Secret rather than inline `env` so the
                # passwords aren't readable in the pod spec.
                - secretRef:
                    name: {{ .Values.collectors.existingSecret | default (printf "%s-collector-credentials" .Release.Name) }}
              resources:
                {{- toYaml .Values.collectors.ome.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
{{- end }}
