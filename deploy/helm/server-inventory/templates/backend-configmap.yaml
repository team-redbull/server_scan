apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-api-config
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-inventory
data:
  INVENTORY_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  INVENTORY_METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  INVENTORY_DEFAULT_PAGE_SIZE: {{ .Values.config.defaultPageSize | quote }}
  INVENTORY_MAX_PAGE_SIZE: {{ .Values.config.maxPageSize | quote }}
  INVENTORY_CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
