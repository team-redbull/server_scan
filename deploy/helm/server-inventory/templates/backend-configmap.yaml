apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-api-config
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-inventory
data:
  {{- /* Read by the API *and* by every collector CronJob, which
         envFrom this same ConfigMap — a collector derives each
         server's site from its name at ingest, so both halves must
         agree on the site list or servers land unassigned. */}}
  INVENTORY_SITES: {{ .Values.config.sites | quote }}
  {{- /* Only a collector CronJob's IngestService reads this — the API
         process never constructs one — but it lives in the same shared
         ConfigMap as INVENTORY_SITES rather than a per-collector Secret,
         since every Cisco collector needs the same catalog and none of
         it is sensitive. */}}
  INVENTORY_GPU_MODELS: {{ .Values.config.gpuModels | quote }}
  INVENTORY_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  INVENTORY_METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  INVENTORY_DEFAULT_PAGE_SIZE: {{ .Values.config.defaultPageSize | quote }}
  INVENTORY_MAX_PAGE_SIZE: {{ .Values.config.maxPageSize | quote }}
  INVENTORY_CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
