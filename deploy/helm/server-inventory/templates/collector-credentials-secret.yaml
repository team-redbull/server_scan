{{- /*
One Secret holding every vendor manager's endpoint and login, rendered
from `.Values.collectors.<vendor>` and injected into each collector
CronJob with `envFrom`.

The values go into a Secret rather than straight into the CronJob's `env`
so the passwords are not readable in the pod spec — `kubectl get cronjob
-o yaml` and `kubectl describe pod` both show plain `env` values to
anyone who can read workloads in the namespace, while a `secretKeyRef`
shows only the reference.

That still leaves the passwords in whatever supplies the values. Keeping
them out of a committed values.yaml is the deployer's job: pass them with
`--set`, a `-f secrets.yaml` file that is not in git, or a real secrets
operator. Setting `existingSecret` below skips this template entirely and
uses a Secret managed elsewhere (Vault, External Secrets, sealed-secrets),
which is what a production deployment should do.
*/ -}}
{{- if not .Values.collectors.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-collector-credentials
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-collector-credentials
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-inventory
type: Opaque
stringData:
  {{- with .Values.collectors.ucsManager }}
  {{- /* Login only, no endpoint: the UCS Central collector discovers
         every domain's address from Central and logs into each one with
         these. There is no UCS Manager CronJob. */}}
  INVENTORY_UCS_MANAGER_USERNAME: {{ .username | quote }}
  INVENTORY_UCS_MANAGER_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- with .Values.collectors.ucsCentral }}
  INVENTORY_UCS_CENTRAL_IP: {{ .ip | quote }}
  INVENTORY_UCS_CENTRAL_USERNAME: {{ .username | quote }}
  INVENTORY_UCS_CENTRAL_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- with .Values.collectors.redfishStandalone }}
  {{- /* Login only, no endpoint — the same shape as ucsManager above.
         The endpoints are the hosts in the inventory ConfigMap, so an
         `ip` here would be a value nothing reads. This is the FALLBACK
         used by any host that resolves no per-host credential; most
         estates give each BMC its own account and set
         `credentialsSecret` instead. */}}
  INVENTORY_REDFISH_USERNAME: {{ .username | default "" | quote }}
  INVENTORY_REDFISH_PASSWORD: {{ .password | default "" | quote }}
  {{- end }}
  {{- with .Values.collectors.oneview }}
  INVENTORY_ONEVIEW_IP: {{ .ip | quote }}
  INVENTORY_ONEVIEW_USERNAME: {{ .username | quote }}
  INVENTORY_ONEVIEW_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- with .Values.collectors.ome }}
  INVENTORY_OME_IP: {{ .ip | quote }}
  INVENTORY_OME_USERNAME: {{ .username | quote }}
  INVENTORY_OME_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- with .Values.collectors.intersight }}
  {{- /* Intersight has no login: it signs every request with an API key,
         so its credential is an API Key ID plus that key's PEM private
         half. The variables are named for what they are rather than
         reusing the USERNAME/PASSWORD pair the other vendors take —
         handing Intersight an account password is the obvious first
         guess and never works. See docs/adr/0017-intersight-collector.md.

         `apiKeyPem` is a multi-line PEM. `quote` renders it as a
         double-quoted YAML scalar with escaped newlines, which parses
         back to the original text — so it rides in an ordinary
         environment variable and there is NO key file to mount. */}}
  INVENTORY_INTERSIGHT_IP: {{ .ip | quote }}
  INVENTORY_INTERSIGHT_API_KEY_ID: {{ .apiKeyId | default "" | quote }}
  INVENTORY_INTERSIGHT_API_KEY_PEM: {{ .apiKeyPem | default "" | quote }}
  {{- end }}
{{- end }}
