{{- /*
Connection strings for whichever database this chart bundles.

Only the bundled halves are rendered: an install that bundles Redis and
points at an operated MongoDB gets `redis-uri` here and reads `mongo-uri`
from `db.secretName` (see `serverInventory.mongoSecret`). The name is
deliberately not `<release>-db`, which collides with the default
`db.secretName` an operator may already own.

Passwords come from values rather than being generated, because
`helm template` — which is how Argo CD renders this — has no `lookup`:
a generated password is re-minted on every sync and every pod then holds
a credential the database no longer has.
*/ -}}
{{- if or .Values.mongodb.enabled .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-bundled-db
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-bundled-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: server-inventory
type: Opaque
stringData:
  {{- if .Values.mongodb.enabled }}
  {{- $user := first .Values.mongodb.auth.usernames | required "mongodb.auth.usernames[0] is required when mongodb.enabled" }}
  {{- $pass := first .Values.mongodb.auth.passwords | required "mongodb.auth.passwords[0] is required when mongodb.enabled — see values.yaml" }}
  {{- $db := first .Values.mongodb.auth.databases | required "mongodb.auth.databases[0] is required when mongodb.enabled" }}
  {{- /* authSource is the application database, not `admin`: this is the
         per-database user the subchart creates, not the root account. */}}
  mongo-uri: {{ printf "mongodb://%s:%s@%s:27017/%s?authSource=%s" $user $pass .Values.mongodb.fullnameOverride $db $db | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  {{- /* `-master` is the service the standalone architecture creates. */}}
  redis-uri: {{ printf "redis://:%s@%s-master:6379/0" (.Values.redis.auth.password | required "redis.auth.password is required when redis.enabled — see values.yaml") .Values.redis.fullnameOverride | quote }}
  {{- end }}
{{- end }}
