{{- /*
The React SPA: the `server_scan-frontend` image CI already publishes
(docs/adr/0010), nginx serving static assets on 8080 and nothing else. It
proxies nothing — the API reaches the browser through its own Routes on
the same host (backend-route.yaml).
*/ -}}
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: server-inventory
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: server-inventory
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ include "serverInventory.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- /* nginx writes its pid, logs and request temp files at
                 runtime, so a read-only root needs these three tmpfs
                 mounts rather than dropping the hardening. */}}
          volumeMounts:
            - name: run
              mountPath: /run
            - name: nginx-tmp
              mountPath: /var/lib/nginx/tmp
            - name: nginx-log
              mountPath: /var/log/nginx
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
{{- end }}
