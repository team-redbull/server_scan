{{- /*
The API's own HMAC key for signing keyset-pagination cursors — see
docs/adr/0006 and `app.domain.services.cursor`.

Rendered only when `backend.cursorSecret` is actually set: an install that
leaves it blank gets no `INVENTORY_CURSOR_SECRET` env var at all (see
backend-deployment.yaml), so `Settings` falls back to its own committed
dev-insecure default — which is fine for local/dev, and which `Settings`
itself refuses to boot with once `INVENTORY_ENVIRONMENT=production` (see
`app.config.settings._refuse_the_dev_cursor_secret_in_production`). This
is the same "blank means unconfigured, not empty" shape
`collector-credentials-secret.yaml` uses for every vendor login, and the
same `existingSecret` escape hatch for a value supplied by a secrets
operator instead.
*/ -}}
{{- if and .Values.backend.cursorSecret (not .Values.backend.existingCursorSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cursor-secret
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-cursor-secret
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-inventory
type: Opaque
stringData:
  cursor-secret: {{ .Values.backend.cursorSecret | quote }}
{{- end }}
