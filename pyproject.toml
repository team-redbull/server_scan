[project]
name = "server-inventory"
version = "0.1.0"
description = "Production-grade air-gapped bare-metal server inventory platform"
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pymongo==4.17.0",
    "redis==8.1.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "regex==2026.7.19",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.9",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "testcontainers[mongodb,redis]==4.15.0",
    "ruff==0.14.0",
    "mypy==1.14.1",
    "types-regex",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "integration: requires testcontainers (mongo/redis)",
    "unit: pure domain logic, no I/O",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true
