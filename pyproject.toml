[project]
name = "server-inventory"
version = "0.1.0"
description = "Production-grade air-gapped bare-metal server inventory platform"
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pymongo==4.17.0",
    "redis==8.1.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "regex==2026.7.19",
    "uvicorn[standard]==0.34.0",
    # No `python-multipart`: FastAPI only needs it to parse `Form`/`File`
    # request bodies, and this API has none — every one of its endpoints
    # takes JSON or query parameters. It was declared but never imported,
    # and the version pinned here carried seven known CVEs, so it was
    # removed rather than bumped. Add it back only alongside a real
    # multipart endpoint.
    "ucsmsdk==0.9.27",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "testcontainers[mongodb,redis]==4.15.0",
    "ruff==0.14.0",
    "mypy==1.14.1",
    "types-regex",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on the path so `tools.*` (the operational CLIs)
# is importable by its tests, the same way `uv run python -m tools.x`
# reaches it from the root.
pythonpath = ["backend", "."]
asyncio_mode = "auto"
markers = [
    "integration: requires testcontainers (mongo/redis)",
    "unit: pure domain logic, no I/O",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test. S105/S106: literal strings that look
# like secrets are almost always fixture data (dev cursor secrets, etc.),
# not real credentials. S311: `random.Random` in tests is for deterministic
# shuffling of test fixtures, never for anything security-sensitive.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ucsmsdk ships no type stubs and isn't py.typed (Cisco's own package,
# not something a `types-ucsmsdk` stub-only package exists for on PyPI).
module = ["ucsmsdk.*"]
ignore_missing_imports = true
