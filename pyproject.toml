[project]
name = "server-inventory"
version = "0.1.0"
description = "Production-grade air-gapped bare-metal server inventory platform"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pymongo==4.17.0",
    # 8.0.1, not the newest 8.x: the newest version this platform's actual
    # air-gapped mirror carries. Only `redis.asyncio.Redis` and
    # `redis.exceptions.RedisError` are used anywhere in this codebase —
    # about as stable a surface as redis-py has — so a patch/minor
    # difference within 8.x carries negligible risk.
    "redis==8.0.1",
    "httpx==0.28.1",
    # Signs Cisco Intersight API requests (HTTP Signature hs2019). It is
    # the only way to talk to Intersight at all — there is no password
    # login for its REST API — and the alternative was the official
    # `intersight` SDK, a 57.6 MB wheel carrying 10,112 generated model
    # modules of which this collector would use about eight. See
    # docs/adr/0017-intersight-collector.md, "Decision 1".
    "cryptography==46.0.3",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "regex==2026.7.19",
    "uvicorn[standard]==0.34.0",
    # No `python-multipart`: FastAPI only needs it to parse `Form`/`File`
    # request bodies, and this API has none — every one of its endpoints
    # takes JSON or query parameters. It was declared but never imported,
    # and the version pinned here carried seven known CVEs, so it was
    # removed rather than bumped. Add it back only alongside a real
    # multipart endpoint.
    #
    # ucsmsdk/ucscsdk: pinned to what this platform's actual air-gapped
    # mirror carries (0.9.18 / 0.9.0.8), not the newest PyPI release each
    # had when the collectors were first built (0.9.27 / 0.9.0.10).
    # Every class and attribute `app.infrastructure.providers.ucs_manager`/
    # `ucs_central`/`ucs_common` reads — including `mo_meta.parents` (the
    # DN-depth facts ADR-0009's corrections depend on) and the `presence`
    # enum — was diffed programmatically between both version pairs before
    # pinning down: byte-identical on every field this codebase touches.
    # See ADR-0015's update. Cisco still labels `ucscsdk` an Alpha release.
    "ucsmsdk==0.9.18",
    "ucscsdk==0.9.0.8",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "testcontainers[mongodb,redis]==4.14.2",
    "ruff==0.14.0",
    # Exact `==`, never a range: ty is beta software on 0.0.x versioning and
    # Astral states plainly that diagnostics may change between any two
    # releases. A range would let a `uv sync` fail the gate with no change on
    # our side — the same failure mode ADR-0013's SHA pins exist to prevent.
    # Bumping it is a deliberate act on the quarterly pass, and a new
    # diagnostic after a bump is ty changing, not this codebase regressing.
    # See docs/adr/0019-ty-replaces-mypy.md.
    "ty==0.0.76",
    # Still required after mypy's removal: ty consumes typeshed stub
    # packages exactly as mypy did, and without this one the `Pattern`
    # subscript in `app.domain.services.regex_engine` is unresolvable.
    #
    # Pinned exactly, unlike before. A stub package can change a type
    # checker's diagnostics precisely the way a checker version can, and
    # this one publishes a fresh datestamped release most weeks — an
    # unrelated `uv sync` bumped it mid-migration, which is the same
    # failure mode the `ty` pin above exists to prevent.
    "types-regex==2026.8.31.20260831",
]

[tool.uv]
# The actual mirror URL is not committed here — it's environment-specific
# (`UV_INDEX_URL`/`UV_DEFAULT_INDEX`, or a deployment-local `uv.toml`; see
# docs/air-gap.md). This setting is about how uv searches whatever index(es)
# end up configured: the default "first-index" strategy stops resolving a
# package as soon as *any* configured index reports a version of it, which
# can miss a newer or better-matching version sitting on a different index.
# "unsafe-best-match" searches every configured index and takes the best
# match across all of them. "unsafe" names the real tradeoff — a
# lower-trust index could in principle shadow a package that should have
# come from a higher-trust one — which does not apply in a fully
# air-gapped environment where every configured index is the operator's
# own mirror, not a mix of public and private sources.
# https://docs.astral.sh/uv/reference/settings/#index-strategy
index-strategy = "unsafe-best-match"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on the path so `tools.*` (the operational CLIs)
# is importable by its tests, the same way `uv run python -m tools.x`
# reaches it from the root.
pythonpath = ["backend", "."]
asyncio_mode = "auto"
markers = [
    "integration: requires testcontainers (mongo/redis)",
    "unit: pure domain logic, no I/O",
]

[tool.ruff]
line-length = 100
# The floor (3.12), same reasoning as `[tool.ty.environment]`'s
# `python-version` below: targeting the CI interpreter (3.13) would let
# `UP` (pyupgrade) suggest a 3.13-only construct that breaks the 3.12
# path this project also supports.
target-version = "py312"
src = ["backend", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "ASYNC",
    "S",
    # ANN, code by code rather than the whole prefix. These are the
    # annotation-completeness ratchet: ty has no equivalent of mypy's
    # `disallow_untyped_defs` and cannot grow one (it infers unannotated
    # bodies instead of rejecting them), so with mypy gone this is the
    # only thing keeping every function annotated. Listing the codes rather than "ANN"
    # means a future ruff release cannot add a rule to the gate on its own.
    # ANN401 (`Any` in an annotation) is deliberately absent: `Any` at an
    # untyped-vendor-SDK boundary is this codebase's documented design, and
    # selecting it would flag 37 such sites. See ADR-0019.
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.flake8-annotations]
# Set explicitly rather than inherited, for the same reason the ty rule
# severities are: an upstream default flip must not be able to move this
# gate silently. Every one of these is ruff's current default; writing them
# down is what makes that a decision instead of an accident.
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test. S105/S106: literal strings that look
# like secrets are almost always fixture data (dev cursor secrets, etc.),
# not real credentials. S311: `random.Random` in tests is for deterministic
# shuffling of test fixtures, never for anything security-sensitive.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ty.environment]
# The floor of `requires-python`, not the CI/production interpreter (3.13).
# Checking against the floor is what catches a 3.13-only stdlib or typing
# feature creeping in and silently breaking the air-gapped 3.12 path this
# platform also supports. ty would infer 3.12 on its own from
# `project.requires-python`'s minimum, which is the right answer — it is
# written out anyway so that widening `requires-python` later cannot
# silently move what this gate checks.
python-version = "3.12"
# `app.*` is first-party and lives under `backend/`, not at the repo root.
# ty needs no counterpart to the `ignore_missing_imports` overrides that
# used to sit here for `testcontainers`, `ucsmsdk` and `ucscsdk`: it
# resolves an untyped dependency from its installed source rather than
# giving up on it, which is how it caught a bad `ucsmsdk` call that was
# invisible under those overrides. See ADR-0019.
root = ["backend"]

[tool.ty.rules]
# Only rules this project has actually reasoned about are written down; the
# rest ride on ty's defaults. That is a deliberate line, not laziness — see
# ADR-0019. The exact version pin is what stops defaults moving underneath
# us, and these four are pinned specifically because ty 0.0.76's published
# rules reference disagrees with the shipped binary about their default
# severity. Trusting the docs here would have put 15 findings in the gate.
#
# On: cheap, currently clean, and both catch a real class of mistake.
unused-awaitable = "error"
blanket-ignore-comment = "error"
# Off: these fire wherever `Any` reaches a declared type. On this codebase
# that is 15 sites, 13 of which are `Any` arriving from an untyped vendor
# SDK or from Starlette's `request.state`/`app.state` — deliberate, and
# documented as such — and 2 of which are ty 0.0.76 typing pydantic's
# `model_dump()` as `Unknown`. mypy caught none of them either, so enabling
# these would cost 15 suppressions and buy no coverage the gate had before.
unsound-return-statement = "ignore"
unsound-assignment = "ignore"
missing-type-argument = "ignore"
# Off: PEP 698 `@override` is a convention this repo has not adopted. It is
# a style question, not a correctness one, and adopting it is its own change.
missing-override-decorator = "ignore"
