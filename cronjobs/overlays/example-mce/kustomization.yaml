# An MCE hub: both jobs.
#
# The agents job covers the fleet this MCE manages; the nodes job covers
# the hub's own control-plane hardware, which is a cluster like any other
# and would otherwise never be reported as in use.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: server-inventory

resources:
  - ../../base

configMapGenerator:
  - name: openshift-membership-config
    behavior: merge
    literals:
      - cluster-name=mce-tlv
      - mce-id=mce-tlv
