# A UPI cluster: the nodes job only. Copy this per cluster and change the
# namespace and cluster-name.
#
# `agents-cronjob.yaml` is deliberately removed rather than left disabled:
# a cluster with no Agent CRD would run it every 15 minutes and fail every
# time, turning a real alert channel into noise.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: server-inventory

resources:
  - ../../base

patches:
  - target:
      kind: CronJob
      name: openshift-agents
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: openshift-agents

configMapGenerator:
  - name: openshift-membership-config
    behavior: merge
    literals:
      - cluster-name=ocp4-tlv
