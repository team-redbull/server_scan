# Every cluster: report the worker nodes this cluster is running.
#
# Claims the servers it lists and releases the ones it no longer does —
# but only among servers already naming THIS cluster, so it can never
# free another cluster's machines. See ../README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openshift-nodes
  labels:
    app.kubernetes.io/name: openshift-nodes
    app.kubernetes.io/component: membership
    app.kubernetes.io/part-of: server-inventory
spec:
  schedule: "*/15 * * * *"
  # Forbid, not Replace: a run that overlaps its successor would have two
  # reconciles racing on the same servers, and the loser's release would
  # undo the winner's claim.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      # Well under the 15-minute schedule, so a hung run is killed before
      # the next one is due rather than blocking it under Forbid.
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: openshift-membership
          # The one workload in this platform that needs its token: it
          # reads its own cluster's API. Every collector CronJob in
          # deploy/ sets this false.
          automountServiceAccountToken: true
          containers:
            - name: membership
              image: ghcr.io/team-redbull/server_scan-api:latest
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -m
                - tools.collect_openshift
                - --source
                - nodes
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                # Which cluster this is. Written onto every server this
                # job claims, and the scope it is allowed to release.
                - name: INVENTORY_OPENSHIFT_CLUSTER_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: openshift-membership-config
                      key: cluster-name
                # Applied after the worker label selector, not instead of
                # it — see ../README.md.
                - name: INVENTORY_OPENSHIFT_EXCLUDE_NAME_PARTS
                  valueFrom:
                    configMapKeyRef:
                      name: openshift-membership-config
                      key: exclude-name-parts
                      optional: true
                - name: INVENTORY_MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: server-inventory-db
                      key: mongo-uri
                - name: INVENTORY_CURSOR_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: server-inventory-cursor
                      key: cursor-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
