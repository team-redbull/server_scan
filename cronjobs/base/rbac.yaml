# Read-only access to the two things these jobs look at.
#
# ClusterRole rather than Role: `oc get nodes` is cluster-scoped, and
# Agents live in one namespace per managed cluster on a hub, so a
# namespaced Role would need one binding per cluster the MCE manages and
# would silently miss any added later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshift-membership
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-membership-reader
rules:
  # Nodes: the job lists them and reads names and labels. `get` is not
  # needed — nothing here fetches a node by name.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  # Agents: the MCE's own CRD. Absent on a cluster that is not a hub,
  # which is fine — the nodes job never touches this group, and the
  # agents job is only deployed where it exists.
  - apiGroups: ["agent-install.openshift.io"]
    resources: ["agents"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-membership-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-membership-reader
subjects:
  - kind: ServiceAccount
    name: openshift-membership
    # Set by the overlay: the namespace this is deployed into.
    namespace: server-inventory
