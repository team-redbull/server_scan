# Minimal SPA-serving nginx config. Only the parts that differ from the
# ubi9/nginx-124 image's own default are set here; the base image already
# handles the unprivileged listen port, user, and pid file location.

worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA routing: any path that isn't a static asset falls back to
    # index.html so client-side routing (react-router) can handle it.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # The backend API and platform endpoints are proxied by the cluster's
    # Route/ingress in production (see deploy/), not by this container —
    # this image only ever serves the built static assets.

    location ~* \.(?:css|js|svg|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
