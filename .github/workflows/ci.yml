name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-flight run when a PR is pushed to again. Never cancel a
# main run — that one can be mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact release: no rolling v8/v9/v10 major tag is
      # published for this action (all 404) — the same trap that broke
      # github-tag-action in ADR-0010. enable-cache reuses the uv cache
      # across runs, keyed on uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # Matches the command CLAUDE.md documents — `tools/` is real
      # shipped code (the collector runner) and was previously unchecked.
      - name: mypy
        run: uv run mypy backend/app tools

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVENTORY_MONGO_URI: mongodb://localhost:27017
      INVENTORY_REDIS_URI: redis://localhost:6379/0
      INVENTORY_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVENTORY_MONGO_URI: mongodb://localhost:27017
      INVENTORY_REDIS_URI: redis://localhost:6379/0
      INVENTORY_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --all-groups

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        # No --with-deps: the runner image already has every browser lib,
        # so it only added CJK/Cyrillic fonts this Latin-only UI never
        # renders — 21 MB at 35 kB/s from a slow apt mirror, 10 of the
        # step's 10m30s. --only-shell skips the headed Chrome build; the
        # chromium project sets no channel and runs headless.
        run: npx playwright install chromium --only-shell

      - name: Start backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8080 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready && exit 0
            sleep 1
          done
          echo "backend did not become ready in time"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      # Small on purpose — E2E flow coverage, not the 10k/50k scale
      # verification tools/loadtest.py owns (docs/adr/0007).
      - name: Seed a deterministic dataset
        run: uv run python -m tools.seed_inventory --count 300 --seed 42

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm run dev -- --port 5173 --host > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 1
          done
          echo "frontend dev server did not become ready in time"
          cat "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  publish:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never against untested or not-yet-merged code.
    needs: [lint, test, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # mathieudutour/github-tag-action pushes the new git tag
      packages: write # docker/login-action pushes images to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the tag action scans every commit since the last tag

      # `feat!:`/`BREAKING CHANGE:` -> major, `feat:` -> minor, anything
      # else -> patch. Pinned to an exact release: this action has no
      # rolling v6 tag (see ADR-0010).
      - name: Determine next version from Conventional Commits
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          fetch_all_tags: true

      # GHCR requires a lowercase image path; github.repository isn't.
      - name: Lowercase image namespace
        run: |
          echo "IMAGE_NAMESPACE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Both images get: full semver, rolling major.minor and major,
      # `latest`, and the commit sha.
      - name: API image metadata
        id: meta_api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}-api
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.new_tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64 # the image's own Python download is x86_64-only, see Containerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Frontend image metadata
        id: meta_frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}-frontend
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.new_tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
