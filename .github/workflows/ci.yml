name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-flight run when a PR is pushed to again. Never cancel a
# main run — that one can be mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the human-readable
# version in the trailing comment. A tag is a mutable pointer: whoever
# controls an action's repository can re-point `v7` at new code, and every
# workflow using `@v7` picks it up on the next run with no diff anywhere.
# That is not hypothetical — it is how tj-actions/changed-files was used
# in 2025 to dump CI secrets out of thousands of repositories. A SHA
# cannot be re-pointed.
#
# The cost is real and unmitigated: a pinned action never updates itself,
# so these SHAs need a periodic manual pass against each action's latest
# release, or they rot into "old and unpatched" — which is the opposite
# of what the pinning is for.
env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # enable-cache reuses the uv cache across runs, keyed on uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # Matches the command CLAUDE.md documents — `tools/` is real
      # shipped code (the collector runner) and was previously unchecked.
      - name: mypy
        run: uv run mypy backend/app tools

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVENTORY_MONGO_URI: mongodb://localhost:27017
      INVENTORY_REDIS_URI: redis://localhost:6379/0
      INVENTORY_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVENTORY_MONGO_URI: mongodb://localhost:27017
      INVENTORY_REDIS_URI: redis://localhost:6379/0
      INVENTORY_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --all-groups

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        # No --with-deps: the runner image already has every browser lib,
        # so it only added CJK/Cyrillic fonts this Latin-only UI never
        # renders — 21 MB at 35 kB/s from a slow apt mirror, 10 of the
        # step's 10m30s. --only-shell skips the headed Chrome build; the
        # chromium project sets no channel and runs headless.
        run: npx playwright install chromium --only-shell

      - name: Start backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8080 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready && exit 0
            sleep 1
          done
          echo "backend did not become ready in time"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      # Small on purpose — E2E flow coverage, not the 10k/50k scale
      # verification tools/loadtest.py owns (docs/adr/0007).
      - name: Seed a deterministic dataset
        run: uv run python -m tools.seed_inventory --count 300 --seed 42

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm run dev -- --port 5173 --host > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 1
          done
          echo "frontend dev server did not become ready in time"
          cat "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  publish:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never against untested or not-yet-merged code.
    needs: [lint, test, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # mathieudutour/github-tag-action pushes the new git tag
      packages: write # docker/login-action pushes images to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the tag action scans every commit since the last tag

      # `feat!:`/`BREAKING CHANGE:` -> major, `feat:` -> minor, anything
      # else -> patch. Pinned to an exact release: this action has no
      # rolling v6 tag (see ADR-0010).
      - name: Determine next version from Conventional Commits
        id: version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          fetch_all_tags: true

      # GHCR requires a lowercase image path; github.repository isn't.
      - name: Lowercase image namespace
        run: |
          echo "IMAGE_NAMESPACE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Both images get: full semver, rolling major.minor and major,
      # `latest`, and the commit sha.
      - name: API image metadata
        id: meta_api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}-api
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.new_tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64 # the image's own Python download is x86_64-only, see Containerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Frontend image metadata
        id: meta_frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}-frontend
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.new_tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: frontend/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
